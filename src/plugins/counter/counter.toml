# Counter plugin manifest — Phase 1 keystone experimental capability.
#
# Authority comes from the OperationRights set at mint time:
#   READ      → read the value
#   WRITE     → increment
#   ADMIN     → reset
#
# The kernel's job (cspace.restrict) is to enforce that a derived cap
# cannot *gain* authority over what its parent holds.

[plugin]
name    = "counter"
version = "0.1.0"

[isolate]
kind = "in_proc"

[source]
kind = "inline"

[[exposes]]
name      = "counter"
in_type   = "object"
out_type  = "object"
streaming = false

# Capability contract — JSON Schema for input / output, surfaced by
# the HTTP bridge and any type-aware caller. The `actions` field
# documents which `op` strings the handler accepts; an agent that
# reads the contract can map `op` → OperationRights without
# hardcoding the vocabulary.
[exposes.contract]
description = "Shared integer behind a mutex. Three actions: read, increment, reset."
input_schema = { type = "object", required = ["op"], properties = { op = { type = "string", enum = ["read", "increment", "reset"] } } }
output_schema = { type = "object", required = ["value"], properties = { value = { type = "integer" } } }

[resources]
timeout_ms = 5000
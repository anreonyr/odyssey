# Echo chain plugin — depends on the basic echo plugin (N14 demo).
# When loaded, validates that an "echo" plugin satisfying ^0.1 is
# registered. If not, this plugin's body fails to activate.

[plugin]
name    = "echo-chain"
version = "0.1.0"

[isolate]
kind = "in_proc"

[source]
kind = "inline"

[[exposes]]
name      = "echo_chain"
in_type   = "any"
out_type  = "any"
streaming = false

# Each [[host]] is a separate table entry.
[[host]]
service = "dispatcher"

[[host]]
service = "registry"

# Dependency: requires "echo" ^0.1 to be loaded first.
[[consumes]]
plugin     = "echo"
version    = "^0.1"
capability = "echo"

[resources]
timeout_ms = 200

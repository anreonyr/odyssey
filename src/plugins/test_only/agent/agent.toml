# RuleAgent manifest — Phase 2 P5.
#
# The agent is type-agnostic; it receives its capability environment
# at construction time. Different capability environments produce
# different reachable worlds.

[plugin]
name    = "agent"
version = "0.1.0"

[isolate]
kind = "in_proc"


[[exposes]]
name          = "agent"
in_type       = "object"
out_type      = "object"
streaming     = false
contract_name = "agent"

[resources]
timeout_ms = 5000

# Channel plugin manifest — Phase 2 P4.
#
# The plugin exposes two capabilities: the producer side (channel_a)
# and the consumer side (consumer_a). They are wired together at
# boot time by the host, which calls channel_pair() and installs each
# half at a distinct slot under the corresponding name.
#
# The two halves are different shapes on purpose: the producer is
# sync (sending is request/response) and the consumer is a stream
# (subscribing is a series of items until the producer drops). The
# kernel treats both uniformly as `Resource` instances.

[plugin]
name    = "channel"
version = "0.1.0"

[isolate]
kind = "in_proc"


[[exposes]]
name          = "channel_a"
in_type       = "object"
out_type      = "object"
streaming     = false
contract_name = "channel"

[exposes.protocol]
description = "Producer side of an in-process channel; sends a JSON message on invoke."
input_schema = { type = "object", required = ["message"] }
output_schema = { type = "object", required = ["channel", "status"] }
media_type = "application/json"
version = "1.0"
transport = "in-process"

[[exposes.authority.actions]]
name      = "send"
operation = "EXECUTE"

[[exposes]]
name          = "consumer_a"
in_type       = "null"
out_type      = "object"
streaming     = true
contract_name = "consumer"

[exposes.protocol]
description = "Consumer side of an in-process channel; open returns a stream of incoming messages."
output_schema = { type = "object" }
media_type = "application/json"
version = "1.0"
transport = "in-process"

[[exposes.authority.actions]]
name      = "subscribe"
operation = "READ"

[resources]
timeout_ms = 1000

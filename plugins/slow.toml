# Slow plugin manifest — sleeps 200ms per call to exercise the Limiter.
# timeout_ms=50 means the Limiter should reject this.

[plugin]
name    = "slow"
version = "0.1.0"

[isolate]
kind = "in_proc"

[source]
kind = "inline"

[[exposes]]
name      = "slow"
in_type   = "any"
out_type  = "any"
streaming = false

[[host]]
service = "dispatcher"

[resources]
timeout_ms = 50

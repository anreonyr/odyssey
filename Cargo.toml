[workspace]
resolver = "2"
members = [".", "builtins"]

[package]
name = "odyssey"
version = "0.1.0"
edition = "2024"
description = "seL4-style capability kernel: manifest-driven plugins with typed Capability<R> minted into a CapabilitySpace and possessed via unforgeable Slot references."
license = "MIT"
authors = ["anreonyr <anreonyr@gmail.com>"]
repository = "https://github.com/anreonyr/odyssey"
keywords = ["kernel", "capability", "sel4", "plugin", "manifest"]
categories = ["os", "development-tools::plugins"]

[dependencies]
semver = { version = "1", features = ["serde"] }
thiserror = "2"
toml = "0.8"
tokio = { version = "1.50", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
futures-core = "0.3"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bitflags = { version = "2", features = ["serde"] }

[dev-dependencies]
# The example binary at examples/basic.rs depends on the
# `odyssey-builtins` workspace member. Putting it in
# `[dev-dependencies]` keeps the library crate independent of
# `builtins` (avoids a cyclic dependency, since `builtins`
# depends on `odyssey`).
odyssey-builtins = { path = "builtins" }
# `tests/layering.rs` uses `syn` to walk use-trees. Subagent A's
# audit flagged the previous line-scanner as bypassable by
# group imports (`use crate::{capability, personality};`) and
# as not scanning the `builtins/` workspace member.
syn = { version = "2", features = ["full", "parsing", "visit"] }

[features]
default = []

[workspace]
resolver = "2"
members = [".", "echo-cdylib"]

[package]
name = "odyssey"
version = "0.1.0"
edition = "2024"
description = "seL4-style capability kernel: manifest-driven plugins with typed Capability<R, K> minted into a CapabilitySpace and possessed via unforgeable Slot references."
license = "MIT"
authors = ["anreonyr <anreonyr@gmail.com>"]
repository = "https://github.com/anreonyr/odyssey"
keywords = ["kernel", "capability", "sel4", "plugin", "manifest"]
categories = ["os", "development-tools::plugins"]

[dependencies]
cordis-rust = "0.2.1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
toml = "0.8"
tokio = { version = "1.50", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wat = "1"
wasmtime = "30"
axum = "0.7"
futures-core = "0.3"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bitflags = { version = "2", features = ["serde"] }

[[bin]]
name = "odyssey"
path = "src/main.rs"

# Integration tests are auto-discovered from tests/ by cargo, but
# `tests/<name>/mod.rs` style directories need an explicit [[test]]
# entry — the auto-discovery path doesn't pick them up under
# cargo 1.100-nightly. Each test crate here shares tests/common/.
[[test]]
name = "alpha"
path = "tests/alpha/mod.rs"

[[test]]
name = "beta"
path = "tests/beta/mod.rs"

[[test]]
name = "gamma"
path = "tests/gamma/mod.rs"

[[test]]
name = "delta"
path = "tests/delta/mod.rs"

[[test]]
name = "epsilon"
path = "tests/epsilon/mod.rs"

[[test]]
name = "zeta"
path = "tests/zeta/mod.rs"
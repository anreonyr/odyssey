<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>odyssey — kernel frontend</title>
  <style>
    body { font: 13px ui-monospace, monospace; background: #0d1117; color: #c9d1d9; margin: 24px; max-width: 920px; }
    h1 { font-size: 16px; margin: 0 0 12px; color: #58a6ff; }
    h2 { font-size: 13px; margin: 16px 0 8px; color: #8b949e; }
    .cap { padding: 4px 8px; margin: 2px; border-radius: 4px; background: #161b22; display: inline-block; cursor: pointer; }
    .cap:hover { background: #21262d; }
    .cap.streaming { border-left: 3px solid #d29922; }
    .cap.sync { border-left: 3px solid #3fb950; }
    .cap.unreachable { opacity: .45; }
    .row { display: flex; gap: 8px; align-items: flex-start; }
    textarea { width: 100%; min-height: 80px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 6px; font: inherit; }
    input { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 6px; font: inherit; }
    button { background: #238636; color: white; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
    button:hover { background: #2ea043; }
    pre { background: #161b22; padding: 8px; border-radius: 4px; overflow: auto; max-height: 240px; }
    .stream-out { white-space: pre-wrap; min-height: 1.5em; }
    .err { color: #f85149; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #21262d; vertical-align: middle; }
    th { color: #8b949e; font-weight: normal; }
    .op { display: inline-block; padding: 1px 5px; margin-right: 3px; border-radius: 3px; background: #21262d; color: #8b949e; }
    .op.read { color: #3fb950; }
    .op.execute { color: #d29922; }
    .note { color: #8b949e; }
    .dimgroup { margin-top: 4px; }
  </style>
</head>
<body>
  <h1>odyssey — everything-is-a-plugin kernel, frontend view</h1>

  <h2>registered capabilities</h2>
  <div id="caps"><span class="note">loading…</span></div>
  <div class="note" id="caps-note"></div>

  <h2>agent — reachable handles</h2>
  <div id="agent"><span class="note">loading…</span></div>
  <div id="agent-table"></div>
  <div class="row" style="margin-top:8px">
    <input id="describe-handle" placeholder="handle" style="flex:0 0 200px" readonly>
    <button onclick="invokeDescribe()">describe</button>
    <span class="note">pick a handle above</span>
  </div>
  <pre id="describe-out"></pre>

  <h2>single-value invoke</h2>
  <div class="row">
    <input id="single-cap" placeholder="capability name" style="flex: 0 0 200px;">
    <textarea id="single-input" placeholder='{"any": "json"}'>{"hello": "world"}</textarea>
    <button onclick="invokeSingle()">invoke</button>
  </div>
  <pre id="single-out"></pre>

  <h2>streaming invoke (SSE)</h2>
  <div class="row">
    <input id="stream-cap" placeholder="capability name" value="streaming_echo" style="flex: 0 0 200px;">
    <textarea id="stream-input">{"text": "hi", "count": 5, "delay_ms": 150}</textarea>
    <button onclick="invokeStream()">stream</button>
  </div>
  <pre id="stream-out" class="stream-out"></pre>

  <script>
    let caps = [];
    // handle -> { handle, live }. Empty when the agent is not
    // reachable, which is the state the whole page degrades to.
    let reachable = new Map();
    let agentUp = false;

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // The agent is reached like any other capability — two sync
    // invokes against /api/invoke. `agent_list` is the reachable
    // set; `agent_describe` reads one row of it.
    async function invokeAgent(cap, input) {
      const r = await fetch('/api/invoke', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ capability: cap, input })
      });
      const body = await r.json();
      if (!r.ok) throw new Error(body.error || (cap + ' failed'));
      return body.value;
    }

    // Empty `reachable` and `agentUp === false` is the state the
    // whole page degrades to when the agent is not mounted.
    async function refreshAgent() {
      try {
        const value = await invokeAgent('agent_list', {});
        reachable = new Map(value.handles.map(h => [h.handle, h.live]));
        agentUp = true;
      } catch (e) {
        reachable = new Map();
        agentUp = false;
        const el = document.getElementById('agent');
        el.innerHTML = '';
        const err = document.createElement('span');
        err.className = 'err';
        err.textContent = 'agent unavailable: ' + e.message;
        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = 'the page keeps working; per-capability access rights are simply not shown';
        el.appendChild(err);
        el.appendChild(note);
      }
    }

    // One row of the agent's table. Built as DOM rather than an
    // HTML string so that a handle can never be read as markup —
    // handles come from manifests, and quoting one into an
    // attribute would be a parse error waiting for an apostrophe.
    //
    // `streaming` is passed in from /api/caps rather than read off
    // the describe payload: a revoked capability reports only
    // handle/live/capability/contract, so `kind` is absent exactly
    // when the row is dead, and a dead stream cap would otherwise
    // be drawn as sync.
    function describeRow(handle, streaming, d) {
      const tr = document.createElement('tr');

      const handleCell = document.createElement('td');
      const chip = document.createElement('span');
      chip.className = 'cap ' + (streaming ? 'streaming' : 'sync') + (d.live ? '' : ' unreachable');
      chip.textContent = handle;
      chip.onclick = () => describe(handle);
      handleCell.appendChild(chip);
      tr.appendChild(handleCell);

      const cells = [
        d.live ? (d.name || handle) : null,
        d.kind || null,
        d.operations || null,
        d.timeout_ms !== undefined ? d.timeout_ms + 'ms' : null,
      ];
      for (const value of cells) {
        const td = document.createElement('td');
        if (value === null) {
          td.innerHTML = '<span class="note">—</span>';
          if (!d.live) td.title = 'revoked — the row survives, the capability does not';
        } else if (Array.isArray(value)) {
          value.forEach(op => {
            const span = document.createElement('span');
            span.className = 'op' + (op === 'READ' ? ' read' : op === 'EXECUTE' ? ' execute' : '');
            span.textContent = op;
            td.appendChild(span);
          });
        } else {
          td.textContent = value;
        }
        tr.appendChild(td);
      }
      return tr;
    }

    function capChip(name, streaming, unreachable, onClick) {
      const span = document.createElement('span');
      span.className = 'cap ' + (streaming ? 'streaming' : 'sync') + (unreachable ? ' unreachable' : '');
      span.textContent = name + (streaming ? ' ⏵' : '');
      if (onClick) span.onclick = onClick;
      return span;
    }

    // Describe every reachable handle at once, so the panel shows
    // the whole table without a click per row. Only handles the
    // agent can see are asked for — describe on anything else
    // answers `unknown handle`, which is the read-only boundary
    // working, not an error worth showing.
    async function refreshAgentTable() {
      const table = document.getElementById('agent-table');
      table.innerHTML = '';
      if (!agentUp || reachable.size === 0) return;

      const head = document.createElement('tr');
      for (const label of ['handle', 'name', 'kind', 'operations', 'timeout']) {
        const th = document.createElement('th');
        th.textContent = label;
        head.appendChild(th);
      }
      const el = document.createElement('table');
      el.appendChild(head);

      const streaming = new Map(caps.map(c => [c.name, c.streaming]));
      for (const handle of reachable.keys()) {
        const isStream = streaming.get(handle) === true;
        try {
          el.appendChild(describeRow(handle, isStream, await invokeAgent('agent_describe', { handle })));
        } catch (e) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 5;
          td.className = 'err';
          td.textContent = handle + ': ' + e.message;
          tr.appendChild(td);
          el.appendChild(tr);
        }
      }
      table.appendChild(el);
    }

    function renderAgentChips() {
      const el = document.getElementById('agent');
      el.innerHTML = '';
      if (!agentUp) return;
      if (reachable.size === 0) {
        el.innerHTML = '<span class="note">the agent declared no reachable handles</span>';
        return;
      }
      const streaming = new Map(caps.map(c => [c.name, c.streaming]));
      for (const [handle, live] of reachable) {
        const chip = capChip(handle, streaming.get(handle) === true, !live, () => describe(handle));
        chip.textContent = handle + (live ? ' ✓' : ' ✗ revoked');
        chip.title = live ? 'live — click to describe' : 'the capability is gone';
        el.appendChild(chip);
      }
    }

    async function describe(handle) {
      document.getElementById('describe-handle').value = handle;
      const out = document.getElementById('describe-out');
      out.textContent = '';
      try {
        const value = await invokeAgent('agent_describe', { handle });
        out.textContent = JSON.stringify(value, null, 2);
      } catch (e) {
        out.innerHTML = '<span class="err">' + esc(e.message) + '</span>';
      }
    }

    function invokeDescribe() {
      const handle = document.getElementById('describe-handle').value;
      if (handle) describe(handle);
    }

    // What the agent cannot reach, computed from what the cspace
    // holds minus what agent_list named. Membership is by
    // capability name: the binding row's `capability` is the name
    // the cspace registered, and for the four providers that name
    // equals the handle.
    function unreachableCaps() {
      if (!agentUp) return [];
      return caps.filter(c => !reachable.has(c.name));
    }

    function renderCaps() {
      const el = document.getElementById('caps');
      el.innerHTML = '';
      for (const c of caps) {
        const known = reachable.has(c.name);
        const chip = capChip(c.name, c.streaming, agentUp && !known, () => {
          if (c.streaming) {
            document.getElementById('stream-cap').value = c.name;
          } else {
            document.getElementById('single-cap').value = c.name;
          }
          if (agentUp && known) describe(c.name);
        });
        if (agentUp && !known) {
          chip.title = 'the agent has no binding row for this capability';
        }
        el.appendChild(chip);
      }

      const note = document.getElementById('caps-note');
      note.innerHTML = '';
      if (!agentUp) return;

      const missing = unreachableCaps();
      if (missing.length === 0) {
        note.textContent = 'every capability in the cspace is in the agent\'s reachable set';
        return;
      }

      note.appendChild(document.createTextNode('agent unreachable: '));
      for (const c of missing) {
        note.appendChild(capChip(c.name, c.streaming, true, null));
      }
      const explain = document.createElement('div');
      explain.className = 'note';
      explain.textContent = 'mounted in the cspace but named by no binding row, so the agent answers '
        + 'unknown handle for them';
      note.appendChild(explain);
    }

    async function invokeSingle() {
      const cap = document.getElementById('single-cap').value;
      let input;
      try { input = JSON.parse(document.getElementById('single-input').value); }
      catch (e) { document.getElementById('single-out').innerHTML = '<span class="err">invalid json: '+esc(e)+'</span>'; return; }
      const r = await fetch('/api/invoke', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ capability: cap, input })
      });
      const out = document.getElementById('single-out');
      if (r.ok) {
        const body = await r.json();
        out.textContent = JSON.stringify(body, null, 2);
      } else {
        const body = await r.json();
        out.innerHTML = '<span class="err">'+esc(body.error)+'</span>';
      }
    }

    async function invokeStream() {
      const cap = document.getElementById('stream-cap').value;
      let input;
      try { input = JSON.parse(document.getElementById('stream-input').value); }
      catch (e) {
        const out = document.getElementById('stream-out');
        out.innerHTML = '<span class="err">invalid json: '+esc(e)+'</span>';
        return;
      }
      const out = document.getElementById('stream-out');
      out.textContent = '';
      const r = await fetch('/api/stream', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ capability: cap, input })
      });
      if (!r.ok) {
        const body = await r.json();
        out.innerHTML = '<span class="err">'+esc(body.error)+'</span>';
        return;
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        // SSE frames are separated by blank lines; parse one at a time.
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const ev = {};
          for (const line of frame.split('\n')) {
            if (line.startsWith('event:')) ev.event = line.slice(6).trim();
            else if (line.startsWith('data:')) ev.data = (ev.data || '') + line.slice(5).trim();
          }
          if (ev.event === 'chunk') {
            out.textContent += ev.data.replace(/^"|"$/g, '');
          } else if (ev.event === 'done') {
            out.textContent += '\n[done]';
          } else if (ev.event === 'error') {
            out.innerHTML = '<span class="err">'+esc(ev.data)+'</span>';
          }
        }
      }
    }

    // Order matters: the capability list and the agent's reachable
    // set are independent reads, and the page renders once both
    // have settled so no chip is drawn twice.
    (async function boot() {
      const r = await fetch('/api/caps');
      caps = await r.json();
      await refreshAgent();
      renderCaps();
      renderAgentChips();
      await refreshAgentTable();
    })();
  </script>
</body>
</html>

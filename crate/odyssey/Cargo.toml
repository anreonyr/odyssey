[package]
name = "odyssey"
version = "0.1.0"
edition = "2024"
description = "seL4-style capability kernel: manifest-driven plugins with typed Capability<R> minted into a CapabilitySpace and possessed via unforgeable Slot references."
license = "MIT"
authors = ["anreonyr <anreonyr@gmail.com>"]
repository = "https://github.com/anreonyr/odyssey"
keywords = ["kernel", "capability", "sel4", "plugin", "manifest"]
categories = ["os", "development-tools::plugins"]

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
futures-core = "0.3"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bitflags = { version = "2", features = ["serde"] }

[dev-dependencies]
# `crate/odyssey/tests/layering.rs` walks use-trees with `syn`
# to enforce the layer-dependency invariant (core ← capability
# ← personality). Subagent A's audit flagged a previous
# line-scanner as bypassable by group imports, so the syn
# walker is the load-bearing piece.
syn = { version = "2", features = ["full", "parsing", "visit"] }

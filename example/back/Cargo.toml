[package]
name = "odyssey-example-back"
version = "0.1.0"
edition = "2024"
description = "Example binary: boot all built-in plugins and serve the HTTP bridge (also serving the React frontend at example/fore/dist)."

# One crate holds both the builtin lib and the example
# binary. The lib's import name (`odyssey_builtin`) preserves
# the previous workspace-member spelling so `main.rs` and
# `tests/smoke.rs` don't have to change `use` lines.
[lib]
name = "odyssey_builtin"
path = "src/lib.rs"

[[bin]]
name = "odyssey-example-back"
path = "src/main.rs"

[dependencies]
# The kernel lives in the sibling `crate/` workspace. Path
# dependency rather than workspace one because the lib is
# in a different workspace root.
odyssey = { path = "../../crate/odyssey" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50", features = ["full"] }
tokio-stream = "0.1"

[dev-dependencies]
# `tests/smoke.rs` exercises the live API + the built
# frontend bundle. It signals the example binary with
# SIGINT first so the orchestrator's teardown runs,
# SIGKILL only as a fallback. Several OpenAI-backend tests
# stand up a local axum server in-process to exercise the
# HTTP path without an external provider; that's where
# axum + serde_json come from.
axum = "0.7"
libc = "0.2.189"
serde_json = "1"
tokio = { version = "1.50", features = ["full", "macros", "rt", "time"] }
tokio-stream = "0.1"

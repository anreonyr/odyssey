[package]
name = "odyssey-example-basic"
version = "0.1.0"
edition = "2024"
description = "Example binary: boot all built-in plugins and serve the HTTP bridge (also serving the React frontend at example/frontend/dist)."

[[bin]]
name = "odyssey-example-basic"
path = "src/main.rs"

[dependencies]
# Lib is in the crate/ workspace; example/ is its own workspace.
odyssey = { path = "../../crate/odyssey" }
odyssey-builtin = { path = "odyssey-builtin" }
tokio = { version = "1.50", features = ["full"] }

[dev-dependencies]
# `tests/smoke.rs` exercises the live API + the built
# frontend bundle. It signals the example binary with
# SIGINT first so the orchestrator's teardown runs,
# SIGKILL only as a fallback. Several OpenAI-backend tests
# stand up a local axum server in-process to exercise the
# HTTP path without an external provider; that's where
# axum + serde_json come from.
axum = "0.7"
libc = "0.2.189"
serde_json = "1"
tokio = { version = "1.50", features = ["full", "macros", "rt", "time"] }
tokio-stream = "0.1"

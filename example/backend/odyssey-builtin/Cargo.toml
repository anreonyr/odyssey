[package]
name = "odyssey-builtin"
version = "0.1.0"
edition = "2024"
description = "Built-in capability plugins for odyssey: echo, reverse, database, streaming_echo, agent observers, llm, memory, agent_runtime, tool_descriptor, profile_inspector."

[lib]
path = "src/lib.rs"

[dependencies]
# The kernel lives in `../../crate/odyssey`. We use a path
# dependency rather than a workspace one because the lib is
# in a different workspace root — the kernel is shipped as
# its own crate and this example sits one level up.
odyssey = { path = "../../../crate/odyssey" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50", features = ["full"] }
tokio-stream = "0.1"
